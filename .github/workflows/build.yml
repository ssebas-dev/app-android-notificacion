name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find project directory and build APK
        run: |
          # 1. Buscar la carpeta que contiene el archivo de configuración build.gradle o build.gradle.kts
          GRADLE_DIR=$(find . -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec dirname {} \; | sort | head -n 1)

          if [ -z "$GRADLE_DIR" ]; then
            echo "Error: No se encontró ningún archivo build.gradle en el repositorio."
            exit 1
          fi

          echo "Directorio del proyecto detectado en: $GRADLE_DIR"
          cd "$GRADLE_DIR"

          # 2. Si gradlew no existe, generar el wrapper automáticamente con gradle
          if [ ! -f "gradlew" ]; then
            echo "gradlew no encontrado. Generando wrapper con Gradle..."
            gradle wrapper
          fi

          chmod +x gradlew

          # 3. Compilar APK Debug
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
